<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos no site</title>
</head>
<body>
    <h1>inserindo videos hopedados localmente</h1>
    <p>esse video esta hospedado no meu servidor</p>
    <video src="videos/Video.mp4" controls></video>
    <h2>add video de varios formatos</h2>
    <video controls>
        <source src="videos/Video.mp4" type="video/mp4">
        <source src="videos/Video.webm" type="video/webm">
         <p>se o navegador n tem compactibilidade com o formato de video <a href="videos/Video.mp4">faça download</a></p>
    </video>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/gqrySQQzvvQ?si=ICAegXNu8b-FO0Bp" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
