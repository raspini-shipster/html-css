<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex.houver</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
         div > p {
    display: none;
   }
   div:hover > p {
    display: block;
   }
        div:hover { 
           color: brown;
        }
    </style>
</head>
<body>
    <h1>exemplo de hover</h1>
    <p>passe o muose</p>
    <div>
        pase o mauose aqui
        <p>peadinha do malandro</p>
    </div>
    <p>fim do exemplo</p>
    
</body>
</html>
